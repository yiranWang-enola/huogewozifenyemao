<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>高中生文理分科与专业选择测评</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#4f6ef7;--primary-dark:#3b54d4;--bg:#f0f4ff;--card:#fff;--text:#2d3748;--text-light:#718096;--accent:#48bb78;--warn:#ed8936;--danger:#f56565;--radius:16px;--shadow:0 4px 24px rgba(79,110,247,.12)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6}
.container{max-width:600px;margin:0 auto;padding:16px}
.header{text-align:center;padding:32px 16px 20px}
.header h1{font-size:24px;font-weight:700;color:var(--primary);margin-bottom:4px}
.header p{font-size:14px;color:var(--text-light)}
.card{background:var(--card);border-radius:var(--radius);padding:24px;margin-bottom:16px;box-shadow:var(--shadow)}
.card h2{font-size:18px;margin-bottom:12px;color:var(--primary)}
.card h3{font-size:15px;margin-bottom:8px;color:var(--text)}
.progress-bar{background:#e2e8f0;border-radius:10px;height:8px;margin-bottom:8px;overflow:hidden}
.progress-fill{background:var(--primary);height:100%;border-radius:10px;transition:width .3s}
.progress-text{font-size:12px;color:var(--text-light);text-align:right}
.question-block{margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid #edf2f7}
.question-block:last-child{border-bottom:none}
.question-text{font-size:15px;font-weight:500;margin-bottom:10px;line-height:1.5}
.options{display:flex;gap:12px}
.option-btn{flex:1;padding:12px;border:2px solid #e2e8f0;border-radius:12px;background:#fff;font-size:15px;cursor:pointer;transition:all .2s;text-align:center;font-weight:500}
.option-btn:hover{border-color:var(--primary);background:#f0f4ff}
.option-btn.selected{border-color:var(--primary);background:var(--primary);color:#fff}
.btn{display:block;width:100%;padding:16px;border:none;border-radius:var(--radius);font-size:16px;font-weight:600;cursor:pointer;transition:all .2s;text-align:center}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-primary:disabled{background:#cbd5e0;cursor:not-allowed}
.btn-outline{background:#fff;color:var(--primary);border:2px solid var(--primary)}
.btn-outline:hover{background:#f0f4ff}
.result-type{display:inline-block;padding:6px 16px;border-radius:20px;font-size:13px;font-weight:600;margin:4px 4px 4px 0}
.type-r{background:#fff3e0;color:#e65100}
.type-i{background:#e8f5e9;color:#2e7d32}
.type-a{background:#fce4ec;color:#c62828}
.type-s{background:#e3f2fd;color:#1565c0}
.type-e{background:#fff8e1;color:#f9a825}
.type-c{background:#f3e5f5;color:#6a1b9a}
.recommendation-box{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border-radius:var(--radius);padding:24px;text-align:center;margin:16px 0}
.recommendation-box .big-text{font-size:36px;font-weight:800;margin:8px 0}
.recommendation-box .confidence{font-size:14px;opacity:.8}
.major-list{list-style:none}
.major-list li{padding:12px 16px;margin-bottom:8px;border-radius:10px;background:#f7fafc;display:flex;justify-content:space-between;align-items:center;font-size:14px}
.major-list .stars{color:#f6ad55;font-size:13px}
.advice-block{background:#fffbeb;border-left:4px solid var(--warn);padding:12px 16px;margin:12px 0;border-radius:0 8px 8px 0;font-size:14px}
.subject-tag{display:inline-block;padding:4px 10px;border-radius:12px;background:#ebf4ff;color:var(--primary);font-size:12px;margin:3px;font-weight:500}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.step-indicator{display:flex;justify-content:center;gap:8px;margin-bottom:20px}
.step-dot{width:10px;height:10px;border-radius:50%;background:#e2e8f0;transition:all .3s}
.step-dot.active{background:var(--primary);width:28px;border-radius:10px}
.step-dot.done{background:var(--accent)}
.section{display:none}
.section.active{display:block}
.footer{text-align:center;padding:24px;color:var(--text-light);font-size:12px}
</style>
</head>
<body>
<div class="container" id="app">

<!-- ====== WELCOME ====== -->
<div class="section active" id="sec-welcome">
  <div class="header">
    <h1>🎓 文理分科 & 专业选择</h1>
    <p>高中生专属 · 霍兰德 + MBTI 双测评</p>
  </div>
  <div class="card">
    <h2>👋 欢迎！</h2>
    <p style="margin-bottom:12px;font-size:14px;line-height:1.8">
      本测评通过<strong>霍兰德职业兴趣测试</strong>和<strong>MBTI人格类型</strong>，帮你：</p>
    <p style="font-size:14px;margin-bottom:4px">📐 判断适合<strong>文科还是理科</strong></p>
    <p style="font-size:14px;margin-bottom:4px">📚 推荐<strong>新高考选科组合</strong></p>
    <p style="font-size:14px;margin-bottom:4px">🎯 匹配<strong>大学专业方向</strong></p>
    <p style="font-size:14px;margin-bottom:16px">💡 提供<strong>张雪峰风格择业建议</strong></p>
    <p style="font-size:13px;color:var(--text-light);margin-bottom:16px">
      ⏱ 约5分钟 · 📱 手机友好 · 🔒 数据不上传</p>
    <button class="btn btn-primary" onclick="startTest()">开始测评 →</button>
  </div>
</div>

<!-- ====== HOLLAND TEST ====== -->
<div class="section" id="sec-holland">
  <div class="header" style="padding:16px">
    <div class="step-indicator">
      <div class="step-dot active" id="dot1"></div>
      <div class="step-dot" id="dot2"></div>
    </div>
    <h1 style="font-size:18px">📋 霍兰德职业兴趣测试</h1>
    <p>共30题 · 请根据真实感受选择</p>
  </div>
  <div class="card">
    <div class="progress-bar"><div class="progress-fill" id="h-progress"></div></div>
    <div class="progress-text" id="h-counter">0/30</div>
    <div id="holland-questions"></div>
    <button class="btn btn-primary" id="holland-next" disabled onclick="nextHollandPage()">下一组 →</button>
  </div>
</div>

<!-- ====== MBTI TEST ====== -->
<div class="section" id="sec-mbti">
  <div class="header" style="padding:16px">
    <div class="step-indicator">
      <div class="step-dot done" id="dot1b"></div>
      <div class="step-dot active" id="dot2b"></div>
    </div>
    <h1 style="font-size:18px">🧠 MBTI 人格类型简测</h1>
    <p>4个维度 · 选择最符合你的</p>
  </div>
  <div class="card" id="mbti-questions"></div>
</div>

<!-- ====== RESULTS ====== -->
<div class="section" id="sec-results">
  <div class="header" style="padding:16px">
    <h1 style="font-size:20px">📊 你的测评报告</h1>
  </div>
  <div id="results-content"></div>
  <div class="card" style="text-align:center">
    <p style="margin-bottom:12px">📱 长按保存截图，或分享给家长/老师</p>
    <button class="btn btn-outline" onclick="restartTest()">🔄 重新测试</button>
  </div>
</div>

<div class="footer">基于霍兰德RIASEC理论 & MBTI人格类型 · 数据参考张雪峰高考志愿建议</div>
</div>

<script>
// ═══════════ DATA ═══════════
const HOLLAND_QUESTIONS = [
  {id:1,type:'R',text:'我喜欢动手修理或制作东西'},
  {id:2,type:'I',text:'我喜欢解决数学或逻辑难题'},
  {id:3,type:'A',text:'我对音乐、色彩和美丽事物敏感'},
  {id:4,type:'S',text:'我喜欢帮助朋友解决他们的困难'},
  {id:5,type:'E',text:'我喜欢在团队中担任领导角色'},
  {id:6,type:'C',text:'我做事注重细节和准确性'},
  {id:7,type:'R',text:'我喜欢户外活动和体育运动'},
  {id:8,type:'I',text:'我对科学实验和探索真相感兴趣'},
  {id:9,type:'A',text:'我经常有新的创意和想法'},
  {id:10,type:'S',text:'我享受教别人学习新东西'},
  {id:11,type:'E',text:'我享受说服别人接受我的观点'},

  {id:14,type:'I',text:'我喜欢花时间想通事情的道理'},
  {id:15,type:'A',text:'我喜欢尝试创新的颜色和款式'},
  {id:16,type:'S',text:'亲密的人际关系对我很重要'},
  {id:17,type:'E',text:'升迁和进步对我极重要'},
  {id:18,type:'C',text:'当我把每日工作计划好时更有安全感'},
  {id:19,type:'R',text:'我喜欢独立完成一项具体任务'},
  {id:20,type:'I',text:'我会不断思索一个问题直到找到答案'},
  {id:21,type:'A',text:'我喜欢重新布置我的环境使之与众不同'},
  {id:22,type:'S',text:'我对别人的困难乐于伸出援手'},
  {id:23,type:'E',text:'能影响别人使我感到兴奋'},
  {id:24,type:'C',text:'我花钱时小心翼翼'},
  {id:25,type:'R',text:'我喜欢把东西拆开看看能否修理'},
  {id:26,type:'I',text:'我喜欢研读所有事实再有逻辑地做决定'},
  {id:27,type:'A',text:'没有美丽事物的生活对我不可思议'},
  {id:28,type:'S',text:'我常关心孤独不友善的人'},
  {id:29,type:'E',text:'做事失败了我再接再厉'},
  {id:30,type:'C',text:'小心谨慎完成一件事让我有成就感'},
];

const HOLLAND_PROFILES = {
  R:{name:'现实型',traits:'动手能力强，喜欢具体实际的任务',majors:['机械工程','土木工程','电气工程','航空航天','车辆工程'],careers:['工程师','技术员','飞行员','运动员']},
  I:{name:'研究型',traits:'喜欢思考分析，对科学充满好奇',majors:['计算机科学','软件工程','数学','物理学','临床医学'],careers:['科学家','程序员','医生','研究员']},
  A:{name:'艺术型',traits:'富有想象力和创造力，喜欢表达',majors:['设计学','建筑学','汉语言文学','新闻传播','音乐表演'],careers:['设计师','作家','导演','建筑师']},
  S:{name:'社会型',traits:'喜欢帮助他人，善于沟通合作',majors:['教育学','心理学','护理学','社会学','人力资源管理'],careers:['教师','心理咨询师','护士','社工']},
  E:{name:'企业型',traits:'自信果断，喜欢领导和说服他人',majors:['工商管理','市场营销','金融学','法学','经济学'],careers:['企业家','律师','投资顾问','销售经理']},
  C:{name:'常规型',traits:'喜欢有条理的工作，注重细节规范',majors:['会计学','财务管理','统计学','审计学','行政管理'],careers:['会计师','审计师','银行职员','行政主管']}
};

const MBTI_QUESTIONS = [
  {dim:'EI',text:'在社交场合中，你通常：',opts:[
    {val:'E',text:'🏠 与人交流让我精力充沛，喜欢成为焦点'},
    {val:'I',text:'📖 更喜欢安静独处或小圈子深度交流'}]},
  {dim:'SN',text:'你更倾向于相信：',opts:[
    {val:'S',text:'🔍 亲眼所见的具体事实和过往经验'},
    {val:'N',text:'💭 直觉、灵感和未来的可能性'}]},
  {dim:'TF',text:'做重要决定时，你更依赖：',opts:[
    {val:'T',text:'🧮 逻辑分析和客观利弊权衡'},
    {val:'F',text:'❤️ 个人价值观和对他人的影响'}]},
  {dim:'JP',text:'关于生活和工作方式，你更喜欢：',opts:[
    {val:'J',text:'📅 制定计划并按时完成，喜欢确定性'},
    {val:'P',text:'🌊 保持灵活开放，享受随性而为'}]}
];

const MBTI_PROFILES = {
  INTJ:{name:'建筑师',as:'理科',majors:['计算机科学','数学','物理学','工程学','哲学'],desc:'战略型思考者，独立解决复杂问题'},
  INTP:{name:'逻辑学家',as:'理科',majors:['计算机科学','数学','物理学','哲学'],desc:'创新思维者，对理论充满热情'},
  ENTJ:{name:'指挥官',as:'理科',majors:['工商管理','经济学','法学','金融学'],desc:'天生的领导者，善于战略执行'},
  ENTP:{name:'辩论家',as:'文理均可',majors:['法学','新闻学','市场营销','计算机科学'],desc:'机智善辩，喜欢智力挑战'},
  INFJ:{name:'提倡者',as:'文科',majors:['心理学','教育学','文学','社会学'],desc:'理想主义者，富有洞察力'},
  INFP:{name:'调停者',as:'文科',majors:['文学','心理学','艺术设计','新闻传播'],desc:'富有创造力，重视价值观'},
  ENFJ:{name:'主人公',as:'文科',majors:['教育学','心理学','人力资源管理','传播学'],desc:'天生教育者，善于激励他人'},
  ENFP:{name:'竞选者',as:'文科',majors:['新闻传播','心理学','市场营销','文学创作'],desc:'热情洋溢，富有创造力'},
  ISTJ:{name:'物流师',as:'理科',majors:['会计学','工程学','法学','医学'],desc:'务实可靠，注重事实细节'},
  ISFJ:{name:'守卫者',as:'文理均可',majors:['护理学','教育学','医学','社会工作'],desc:'忠诚的保护者，乐于助人'},
  ESTJ:{name:'总经理',as:'理科',majors:['工商管理','金融学','法学','工程管理'],desc:'优秀管理者，注重效率秩序'},
  ESFJ:{name:'执政官',as:'文科',majors:['教育学','护理学','人力资源管理','社会工作'],desc:'热心周到，善于照顾他人'},
  ISTP:{name:'鉴赏家',as:'理科',majors:['机械工程','计算机科学','电子工程','体育学'],desc:'动手能力强，喜欢探索原理'},
  ISFP:{name:'探险家',as:'文科',majors:['艺术设计','音乐表演','护理学','摄影'],desc:'灵活艺术家，重视美感和体验'},
  ESTP:{name:'企业家',as:'理科',majors:['市场营销','金融学','工程管理','体育管理'],desc:'精力充沛行动派，善于把握机会'},
  ESFP:{name:'表演者',as:'文科',majors:['表演艺术','旅游管理','学前教育','播音主持'],desc:'天生表演者，热爱生活社交'}
};

const ZXF_ADVICE = {
  R:[
    '工科是普通家庭孩子改变命运的高性价比选择，就业稳、薪资可期。',
    '合肥工业大学、哈工大威海——低调但工科就业杠杠的，中建中铁每年招一大批。'
  ],
  I:[
    '计算机专业是普通家庭孩子改变命运性价比最高的专业，但互联网高薪是用青春换的，35岁之后呢？',
    '学医是一条长线投资，30岁之前别想赚钱，但越老越吃香。'
  ],
  A:[
    '学设计学艺术，家里没矿真的别碰。投入大、回报慢，还得拼审美天赋。',
    '如果你真的热爱艺术，可以考虑数字媒体、UI设计——有技术底子的艺术生最吃香。'
  ],
  S:[
    '师范专业，铁饭碗中的铁饭碗。稳定、体面、有寒暑假——但别指望大富大贵。',
    '心理学听着高大上，但必须读到硕士才有出路。本科毕业很难找到对口工作。'
  ],
  E:[
    '金融专业——如果你家境一般、没有任何社会资源，真心不建议。毕业只能去银行卖理财。',
    '你学了四年管理学，毕业去管谁？人家凭什么让你管？不如学个有技术门槛的专业。'
  ],
  C:[
    '会计是文科中的理科，越老越吃香。CPA证书比名校文凭还管用。',
    '财务、审计这类岗位最大的优点是——任何行业都需要，不用担心失业。'
  ]
};

// ═══════════ STATE ═══════════
let state = {step:'welcome',hollandAnswers:{},hollandPage:0,pageSize:5,mbtiAnswers:{},mode:null}; 

// ═══════════ NAVIGATION ═══════════
function showSection(id){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

function startTest(){
  state = {step:'holland',hollandAnswers:{},hollandPage:0,pageSize:5,mbtiAnswers:{}};
  renderHollandPage();
  showSection('sec-holland');
}

// ═══════════ HOLLAND ═══════════
function renderHollandPage(){
  let start = state.hollandPage * state.pageSize;
  let end = Math.min(start + state.pageSize, HOLLAND_QUESTIONS.length);
  let qs = HOLLAND_QUESTIONS.slice(start, end);
  let html = '';
  qs.forEach(q => {
    let selected = state.hollandAnswers[q.id];
    html += `<div class="question-block">
      <div class="question-text">${q.id}. ${q.text}</div>
      <div class="options">
        <div class="option-btn ${selected===true?'selected':''}" onclick="answerHolland(${q.id},true,this)">✅ 是</div>
        <div class="option-btn ${selected===false?'selected':''}" onclick="answerHolland(${q.id},false,this)">❌ 否</div>
      </div></div>`;
  });
  document.getElementById('holland-questions').innerHTML = html;
  
  let answered = Object.keys(state.hollandAnswers).length;
  document.getElementById('h-progress').style.width = (answered/30*100)+'%';
  document.getElementById('h-counter').textContent = answered+'/30';
  
  let btn = document.getElementById('holland-next');
  let currentAnswered = qs.filter(q=>state.hollandAnswers[q.id]!==undefined).length;
  btn.disabled = currentAnswered < qs.length;
  
  if(end >= HOLLAND_QUESTIONS.length){
    btn.textContent = '查看结果 →';
    btn.onclick = finishHolland;
  } else {
    btn.textContent = '下一组 → ('+(state.hollandPage+1)+'/'+Math.ceil(30/state.pageSize)+')';
    btn.onclick = nextHollandPage;
  }
}

function answerHolland(id,val,el){
  state.hollandAnswers[id] = val;
  el.parentElement.querySelectorAll('.option-btn').forEach(b=>b.classList.remove('selected'));
  el.classList.add('selected');
  let start = state.hollandPage*state.pageSize;
  let end = Math.min(start+state.pageSize,HOLLAND_QUESTIONS.length);
  let qs = HOLLAND_QUESTIONS.slice(start,end);
  let allAnswered = qs.every(q=>state.hollandAnswers[q.id]!==undefined);
  document.getElementById('holland-next').disabled = !allAnswered;
}

function nextHollandPage(){
  state.hollandPage++;
  renderHollandPage();
  window.scrollTo(0,0);
}

function finishHolland(){
  state.step = 'mbti';
  renderMBTI();
  showSection('sec-mbti');
  document.getElementById('dot1b').classList.add('done');
  document.getElementById('dot2b').classList.add('active');
}

// ═══════════ MBTI ═══════════
function renderMBTI(){
  let html = '';
  MBTI_QUESTIONS.forEach((q,i)=>{
    html += `<div style="margin-bottom:24px">
      <h3 style="font-size:15px;margin-bottom:8px">${i+1}. ${q.text}</h3>
      <div class="options" style="flex-direction:column;gap:8px">
        ${q.opts.map(o=>`<div class="option-btn mbti-opt ${state.mbtiAnswers[q.dim]===o.val?'selected':''}" 
          onclick="answerMBTI('${q.dim}','${o.val}',this)" style="text-align:left;padding:14px 16px">
          ${o.text}</div>`).join('')}
      </div></div>`;
  });
  html += `<button class="btn btn-primary" id="mbti-submit" 
    ${Object.keys(state.mbtiAnswers).length<4?'disabled':''} 
    onclick="finishMBTI()">查看完整报告 →</button>`;
  document.getElementById('mbti-questions').innerHTML = html;
}

function answerMBTI(dim,val,el){
  state.mbtiAnswers[dim] = val;
  el.parentElement.querySelectorAll('.mbti-opt').forEach(b=>b.classList.remove('selected'));
  el.classList.add('selected');
  document.getElementById('mbti-submit').disabled = Object.keys(state.mbtiAnswers).length < 4;
}

function finishMBTI(){
  showResults();
  showSection('sec-results');
  document.getElementById('dot2b').classList.add('done');
}

// ═══════════ RESULTS ENGINE ═══════════
function calcHollandCode(){
  let scores = {R:0,I:0,A:0,S:0,E:0,C:0};
  HOLLAND_QUESTIONS.forEach(q=>{
    if(state.hollandAnswers[q.id]===true) scores[q.type]++;
  });
  let sorted = Object.entries(scores).sort((a,b)=>b[1]-a[1]);
  let code = '';
  for(let i=0;i<3;i++){
    if(sorted[i]&&sorted[i][1]>0) code += sorted[i][0];
  }
  return {code,scores,sorted};
}

function calcMBTI(){
  return (state.mbtiAnswers['EI']||'')+(state.mbtiAnswers['SN']||'')+(state.mbtiAnswers['TF']||'')+(state.mbtiAnswers['JP']||'');
}

function analyzeArtsScience(holland,mbti){
  let scores = {理科:0,文科:0};
  let reasoning = [];
  let rTypes=[], aTypes=[];
  
  for(let c of holland.code){
    let p = HOLLAND_PROFILES[c];
    if(['R','I','C'].includes(c)){scores['理科']+=2;rTypes.push(p.name)}
    else if(c==='A'){scores['文科']+=2;aTypes.push(p.name)}
    else if(c==='S'){scores['文科']+=1;scores['理科']+=1}
    else if(c==='E'){scores['理科']+=1.5;scores['文科']+=0.5}
  }
  if(rTypes.length) reasoning.push('霍兰德中的'+rTypes.join('、')+'倾向理科');
  if(aTypes.length) reasoning.push('霍兰德中的'+aTypes.join('、')+'倾向文科');
  
  if(mbti && MBTI_PROFILES[mbti]){
    let mb = MBTI_PROFILES[mbti];
    if(mb.as.includes('理科')) scores['理科']+=1;
    if(mb.as.includes('文科')) scores['文科']+=1;
    reasoning.push('MBTI '+mbti+'（'+mb.name+'）倾向'+mb.as);
  }
  
  let total = scores['理科']+scores['文科'];
  let sciPct = Math.round(scores['理科']/total*100);
  let artPct = Math.round(scores['文科']/total*100);
  
  let rec,conf;
  if(sciPct>65){rec='理科';conf=sciPct}
  else if(artPct>65){rec='文科';conf=artPct}
  else{rec='文理均可';conf=Math.max(sciPct,artPct)}
  
  let subjects = rec==='理科'?
    ['物理+化学+生物（专业覆盖率最高）','物理+化学+地理（工程+规划方向）']:
    rec==='文科'?
    ['历史+政治+地理（传统文科）','历史+政治+生物（增加护理/心理选择）']:
    ['物理+化学+地理（文理兼顾，专业面广）','历史+政治+生物（文科基础+医学护理方向）'];
  
  return {recommendation:rec,confidence:conf,reasoning,subjects,sciPct,artPct};
}

function recommendMajors(holland,mbti){
  let scores = {};
  for(let c of holland.code){
    let w = c===holland.code[0]?2:1;
    (HOLLAND_PROFILES[c].majors||[]).forEach(m=>{scores[m]=(scores[m]||0)+w});
  }
  if(mbti && MBTI_PROFILES[mbti]){
    (MBTI_PROFILES[mbti].majors||[]).forEach(m=>{scores[m]=(scores[m]||0)+1});
  }
  return Object.entries(scores).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([name,score])=>({
    name,score,stars:score>=3?'★★★':score>=2?'★★':'★'
  }));
}

function getAdvice(holland){
  let advice = [];
  for(let c of holland.code){
    if(ZXF_ADVICE[c]) advice.push(...ZXF_ADVICE[c]);
  }
  return [...new Set(advice)].slice(0,4);
}

// ═══════════ RENDER RESULTS ═══════════
function showResults(){
  let h = calcHollandCode();
  let mbti = calcMBTI();
  let as = analyzeArtsScience(h,mbti);
  let majors = recommendMajors(h,mbti);
  let advice = getAdvice(h);
  
  let typeColors = {R:'type-r',I:'type-i',A:'type-a',S:'type-s',E:'type-e',C:'type-c'};
  
  let html = '';
  
  // Holland
  html += `<div class="card"><h2>🔬 霍兰德职业兴趣</h2>`;
  html += `<p style="margin-bottom:8px">你的霍兰德码：<strong style="font-size:22px;color:var(--primary)">${h.code||'—'}</strong></p>`;
  html += `<div style="margin-bottom:8px">`;
  h.sorted.forEach(([t,s])=>{
    if(s>0) html += `<span class="result-type ${typeColors[t]||''}">${HOLLAND_PROFILES[t].name}(${t}): ${s}分</span> `;
  });
  html += `</div>`;
  for(let c of h.code){
    let p = HOLLAND_PROFILES[c];
    html += `<p style="font-size:13px;margin-bottom:4px"><strong>${p.name}：</strong>${p.traits}。适合：${p.majors.slice(0,3).join('、')}等</p>`;
  }
  html += `</div>`;
  
  // MBTI
  if(mbti && MBTI_PROFILES[mbti]){
    let mb = MBTI_PROFILES[mbti];
    html += `<div class="card"><h2>🧠 MBTI 人格类型</h2>`;
    html += `<p style="font-size:22px;color:var(--primary);font-weight:700;margin-bottom:4px">${mbti} — ${mb.name}</p>`;
    html += `<p style="font-size:14px;color:var(--text-light)">${mb.desc}</p>`;
    html += `</div>`;
  }
  
  // Arts/Science Recommendation
  html += `<div class="recommendation-box">
    <div style="font-size:14px">📐 文理分科建议</div>
    <div class="big-text">${as.recommendation}</div>
    <div class="confidence">置信度 ${as.confidence}% ｜ 理科倾向 ${as.sciPct}% ｜ 文科倾向 ${as.artPct}%</div>
  </div>`;
  
  // Reasoning
  html += `<div class="card"><h3>📋 分析依据</h3>`;
  as.reasoning.forEach(r=>html+=`<p style="font-size:14px;margin-bottom:4px">• ${r}</p>`);
  html += `</div>`;
  
  // Subjects
  html += `<div class="card"><h3>📚 新高考选科建议</h3>`;
  as.subjects.forEach(s=>html+=`<span class="subject-tag">${s}</span><br>`);
  html += `</div>`;
  
  // Majors
  html += `<div class="card"><h3>🎯 推荐大学专业 Top 10</h3><ul class="major-list">`;
  majors.forEach((m,i)=>{
    html += `<li><span>${i+1}. ${m.name}</span><span class="stars">${m.stars}</span></li>`;
  });
  html += `</ul></div>`;
  
  // ZXF Advice
  if(advice.length){
    html += `<div class="card"><h3>💡 择业参考建议</h3>`;
    advice.forEach(a=>html+=`<div class="advice-block">💬 ${a}</div>`);
    html += `</div>`;
  }
  
  // Next steps
  html += `<div class="card"><h3>🚀 下一步建议</h3>
    <p style="font-size:13px;margin-bottom:4px">1. 深入了解推荐专业前3名的一级学科评估结果</p>
    <p style="font-size:13px;margin-bottom:4px">2. 体验相关职业的实习或在线课程</p>
    <p style="font-size:13px;margin-bottom:4px">3. 咨询学校生涯规划老师或学长</p>
    <p style="font-size:13px">4. 性格会随成长变化，建议半年后重新评估</p>
  </div>`;
  
  document.getElementById('results-content').innerHTML = html;
}

function restartTest(){
  state = {step:'welcome',hollandAnswers:{},hollandPage:0,pageSize:5,mbtiAnswers:{}};
  showSection('sec-welcome');
}

document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('sec-welcome').classList.add('active');
});
