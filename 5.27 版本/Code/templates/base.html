<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}霍格沃兹分业帽{% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
            background: #0e1629; color: #fff; display: flex; min-height: 100vh;
        }
        .sidebar {
            width: 240px; background: #08111f; padding: 30px 16px;
            position: fixed; height: 100vh; border-right: 1px solid rgba(99,102,241,0.2);
        }
        .sidebar .logo { font-size: 3em; text-align: center; margin-bottom: 12px; }
        .sidebar h2 { text-align: center; color: #818cf8; font-size: 1.1em; margin-bottom: 30px; }
        .stepBox { display: flex; flex-direction: column; gap: 10px; }
        .step {
            padding: 12px 14px; border-radius: 10px;
            background: rgba(99,102,241,0.08); border: 1px solid rgba(99,102,241,0.15);
            transition: all 0.3s; cursor: pointer;
        }
        .step a { color: #94a3b8; text-decoration: none; display: block; font-size: 0.95em; }
        .step:hover { background: rgba(99,102,241,0.18); transform: translateX(4px); }
        .step:hover a { color: #e2e8f0; }
        .step.active { background: linear-gradient(135deg, #6366f1, #8b5cf6); border-color: transparent; }
        .step.active a { color: #fff; }
        .main { margin-left: 240px; padding: 30px; flex: 1; max-width: calc(100% - 240px); }
        .card {
            background: #18233d; border-radius: 15px; padding: 24px;
            border: 1px solid rgba(99,102,241,0.15); margin-bottom: 24px;
        }
        .card h1 { font-size: 1.8em; margin-bottom: 12px; }
        .card h2 { color: #818cf8; font-size: 1.3em; margin-bottom: 16px; }
        .card h3 { color: #94a3b8; font-size: 1.05em; margin-bottom: 12px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 24px; }
        .alert {
            padding: 14px 18px; border-radius: 10px; margin-bottom: 16px;
        }
        .alert-success { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3); color: #22c55e; }
        .btn-primary, .btn-secondary {
            display: inline-block; padding: 12px 24px; border-radius: 10px;
            text-decoration: none; font-weight: 500; transition: all 0.3s;
            border: none; cursor: pointer; font-size: 1em; color: #fff;
        }
        .btn-primary { background: linear-gradient(135deg, #6366f1, #8b5cf6); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(99,102,241,0.4); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-secondary { background: rgba(99,102,241,0.1); color: #818cf8; border: 1px solid rgba(99,102,241,0.3); }
        .btn-secondary:hover { background: rgba(99,102,241,0.2); }
        .form-input, .form-select {
            width: 100%; padding: 12px 16px; background: #0e1629;
            border: 1px solid rgba(99,102,241,0.3); border-radius: 10px;
            color: #e2e8f0; font-size: 1em; margin-bottom: 16px; transition: all 0.3s;
        }
        .form-input:focus, .form-select:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,0.2); }
        .form-select option { background: #18233d; }
        .progress-bar { margin: 16px 0; }
        .progress-info { display: flex; justify-content: space-between; color: #94a3b8; margin-bottom: 8px; font-size: 0.9em; }
        .progress-track { background: rgba(99,102,241,0.1); border-radius: 8px; height: 8px; overflow: hidden; }
        .progress-fill { background: linear-gradient(135deg, #6366f1, #22c55e); height: 100%; transition: width 0.3s; }
        .question-card {
            background: rgba(14,22,41,0.6); border-radius: 12px; padding: 20px;
            border: 1px solid rgba(99,102,241,0.15); transition: all 0.3s; margin-bottom: 16px;
        }
        .question-card.answered { border-color: #22c55e; background: rgba(34,197,94,0.05); }
        .question-header { display: flex; justify-content: space-between; margin-bottom: 12px; }
        .question-num { color: #818cf8; font-weight: 500; }
        .question-dim { background: rgba(99,102,241,0.2); padding: 3px 10px; border-radius: 6px; font-size: 0.85em; color: #818cf8; }
        .question-text { color: #e2e8f0; font-size: 1.05em; margin-bottom: 16px; }
        .options { display: flex; flex-direction: column; gap: 10px; }
        .holland-options { flex-direction: row; gap: 16px; }
        .option-label {
            display: flex; align-items: center; padding: 14px; background: rgba(14,22,41,0.6);
            border-radius: 10px; border: 1px solid rgba(99,102,241,0.15); cursor: pointer; transition: all 0.3s;
        }
        .option-label:hover { background: rgba(99,102,241,0.1); border-color: #6366f1; }
        .option-label input { margin-right: 12px; accent-color: #6366f1; }
        .option-text { color: #e2e8f0; }
        .type-R { color: #f59e0b; } .type-I { color: #3b82f6; } .type-A { color: #ec4899; }
        .type-S { color: #22c55e; } .type-E { color: #ef4444; } .type-C { color: #8b5cf6; }
        .submit-section { display: flex; justify-content: space-between; margin-top: 24px; }
        .result-box { background: rgba(99,102,241,0.1); padding: 20px; border-radius: 12px; margin-bottom: 16px; }
        .result-type { font-size: 1.5em; color: #818cf8; font-weight: bold; margin-bottom: 8px; }
        .result-desc { color: #94a3b8; line-height: 1.6; }
        .recommend-item { background: rgba(99,102,241,0.08); padding: 16px; border-radius: 10px; margin-bottom: 12px; border: 1px solid rgba(99,102,241,0.12); }
        .recommend-item h3 { color: #e2e8f0; margin-bottom: 6px; }
        .match-rate { color: #22c55e; font-weight: bold; }
        .chat { max-height: 350px; overflow-y: auto; padding: 14px; background: rgba(14,22,41,0.5); border-radius: 10px; margin-bottom: 12px; }
        .message { display: flex; gap: 10px; margin-bottom: 12px; align-items: flex-start; }
        .message .avatar { font-size: 1.4em; }
        .message .content { background: rgba(99,102,241,0.1); padding: 12px 16px; border-radius: 12px; color: #e2e8f0; flex: 1; line-height: 1.6; }
        .user-message .content { background: rgba(34,197,94,0.1); }
        .info-table { width: 100%; color: #e2e8f0; }
        .info-table td { padding: 10px 0; }
        .info-table td:first-child { color: #94a3b8; }
        .info-table td:last-child { text-align: right; font-weight: bold; color: #818cf8; }
        .score-bars { display: flex; flex-direction: column; gap: 8px; }
        .score-bar { display: flex; align-items: center; gap: 10px; }
        .score-bar span:first-child { width: 80px; color: #94a3b8; font-size: 0.9em; }
        .score-bar .bar { flex: 1; height: 8px; background: rgba(99,102,241,0.1); border-radius: 4px; overflow: hidden; }
        .score-bar .bar div { height: 100%; background: linear-gradient(135deg, #6366f1, #8b5cf6); transition: width 0.5s; }
        .score-bar span:last-child { width: 30px; color: #818cf8; font-weight: bold; }
        .flow-steps { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
        .flow-step { text-align: center; }
        .flow-num { width: 36px; height: 36px; background: linear-gradient(135deg, #6366f1, #8b5cf6); border-radius: 50%; color: #fff; font-weight: bold; display: flex; align-items: center; justify-content: center; margin: 0 auto 8px; font-size: 0.9em; }
        .flow-text { color: #94a3b8; font-size: 0.85em; }
        .flow-arrow { color: #6366f1; font-size: 1.3em; }
        .test-card { text-align: center; padding: 36px; }
        .test-icon { font-size: 3.5em; margin-bottom: 16px; }
        .dimensions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 12px; }
        .dim-tag { background: rgba(99,102,241,0.2); padding: 5px 10px; border-radius: 6px; font-size: 0.82em; color: #818cf8; }
        @media (max-width: 768px) {
            .sidebar { width: 100%; position: relative; height: auto; }
            .main { margin-left: 0; max-width: 100%; }
            .grid { grid-template-columns: 1fr; }
            body { flex-direction: column; }
        }
        @media print {
            .sidebar { display: none; }
            .main { margin-left: 0; max-width: 100%; }
            .btn-primary, .btn-secondary { display: none; }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="sidebar">
        <div class="logo">🎩</div>
        <h2>霍格沃兹分业帽</h2>
        <div class="stepBox">
            <div class="step {% if current_step == 'home' %}active{% endif %}"><a href="{% url 'home' %}">🏠 首页</a></div>
            <div class="step {% if current_step == 'mbti' %}active{% endif %}"><a href="{% url 'mbti_test' %}">① MBTI测试</a></div>
            <div class="step {% if current_step == 'holland' %}active{% endif %}"><a href="{% url 'holland_test' %}">② 霍兰德测试</a></div>
            <div class="step {% if current_step == 'profile' %}active{% endif %}"><a href="{% url 'profile' %}">③ 个人信息</a></div>
            <div class="step {% if current_step == 'recommend' %}active{% endif %}"><a href="{% url 'recommend' %}">④ 初始推荐</a></div>
            <div class="step {% if current_step == 'game' %}active{% endif %}"><a href="{% url 'game' %}">⑤ 博弈优化</a></div>
            <div class="step {% if current_step == 'report' %}active{% endif %}"><a href="{% url 'report' %}">⑥ 最终报告</a></div>
        </div>
    </div>
    <div class="main">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </div>
    {% block extra_js %}{% endblock %}
</body>
</html>
